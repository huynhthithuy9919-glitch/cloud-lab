services:
  backend:
    image: btdtdm/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000
    network_mode: bridge

  frontend:
    image: btdtdm/mern-frontend:2.0
    container_name: mern-frontend-hub
    ports:
      - "5173:5173"
    network_mode: bridge
